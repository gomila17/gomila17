<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Arquitectura de mi homelab: Internet, Cloudflare Tunnel, Nginx Proxy Manager y stacks de Docker gestionados con Portainer, dentro de Proxmox">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #e6edf3; font-size: 15px; font-weight: 600; }
      .s { font-family: 'Segoe UI', Arial, sans-serif; fill: #8b949e; font-size: 12px; }
      .m { font-family: 'Courier New', monospace; fill: #8b949e; font-size: 12px; }
      .c { font-family: 'Courier New', monospace; fill: #e6edf3; font-size: 13px; font-weight: 700; }
      .box { fill: #161b22; stroke-width: 1.8; filter: url(#soft); }
      .chip { fill: #0d1117; stroke-width: 1.4; }
      .flow { fill: none; stroke-width: 2.2; stroke-dasharray: 7 7; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
    </style>
  </defs>

  <rect width="900" height="480" rx="18" fill="url(#panel)"/>

  <!-- Proxmox -->
  <rect x="205" y="30" width="670" height="420" rx="16" fill="none" stroke="#E57000" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.8"/>
  <text x="225" y="54" class="t" style="fill:#E57000">Proxmox VE</text>
  <text x="315" y="54" class="s">un solo servidor · sin puertos abiertos</text>

  <!-- Internet -->
  <rect class="box" x="25" y="165" width="145" height="90" rx="14" stroke="#58a6ff"/>
  <text x="97" y="205" class="t" text-anchor="middle">Internet</text>
  <text x="97" y="225" class="s" text-anchor="middle">*.gomila.dev</text>

  <!-- LXC cloudflared -->
  <rect class="box" x="225" y="165" width="130" height="90" rx="14" stroke="#F38020"/>
  <text x="290" y="200" class="t" text-anchor="middle">Cloudflare Tunnel</text>
  <text x="290" y="220" class="s" text-anchor="middle">LXC cloudflared</text>
  <text x="290" y="239" class="m" text-anchor="middle">tras CG-NAT</text>

  <!-- LXC AdGuard -->
  <rect class="box" x="225" y="290" width="130" height="62" rx="12" stroke="#3fb950"/>
  <text x="290" y="318" class="t" text-anchor="middle">AdGuard Home</text>
  <text x="290" y="338" class="s" text-anchor="middle">DNS de la casa · LXC</text>

  <!-- LXC homepanel -->
  <rect class="box" x="225" y="365" width="130" height="62" rx="12" stroke="#d29922"/>
  <text x="290" y="393" class="t" text-anchor="middle">homepanel</text>
  <text x="290" y="413" class="s" text-anchor="middle">dashboard · solo LAN</text>

  <!-- VM docker-host -->
  <rect x="385" y="70" width="470" height="360" rx="14" fill="#0f141b" stroke="#2496ED" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="405" y="96" class="t" style="fill:#2496ED">VM docker-host</text>
  <text x="520" y="96" class="s">Debian + Docker</text>

  <!-- NPM -->
  <rect class="box" x="405" y="165" width="120" height="90" rx="14" stroke="#a371f7"/>
  <text x="465" y="200" class="t" text-anchor="middle">NPM</text>
  <text x="465" y="220" class="s" text-anchor="middle">Nginx Proxy Manager</text>
  <text x="465" y="239" class="m" text-anchor="middle">por subdominio</text>

  <!-- Panel de stacks -->
  <rect x="555" y="110" width="285" height="190" rx="12" fill="#161b22" stroke="#2496ED" stroke-width="1.8" filter="url(#soft)"/>
  <text x="572" y="132" class="t">Stacks</text>
  <text x="624" y="132" class="s">un compose por servicio</text>

  <rect class="chip" x="570" y="146" width="120" height="40" rx="8" stroke="#2496ED"/>
  <text x="630" y="171" class="c" text-anchor="middle">opengym</text>
  <rect class="chip" x="705" y="146" width="120" height="40" rx="8" stroke="#2496ED"/>
  <text x="765" y="171" class="c" text-anchor="middle">vikunja</text>

  <rect class="chip" x="570" y="196" width="120" height="40" rx="8" stroke="#EA4B71"/>
  <text x="630" y="221" class="c" text-anchor="middle">n8n</text>
  <rect class="chip" x="705" y="196" width="120" height="40" rx="8" stroke="#2496ED"/>
  <text x="765" y="221" class="c" text-anchor="middle">gomila.dev</text>

  <rect class="chip" x="570" y="246" width="255" height="40" rx="8" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="697" y="271" class="m" text-anchor="middle">… y lo que vaya llegando</text>

  <!-- Portainer -->
  <rect class="box" x="405" y="335" width="435" height="64" rx="12" stroke="#13bef9"/>
  <text x="622" y="363" class="t" text-anchor="middle">Portainer</text>
  <text x="622" y="383" class="s" text-anchor="middle">despliega y gestiona cada stack</text>
  <path d="M697 335 V300" stroke="#13bef9" stroke-width="1.6" stroke-dasharray="3 4" fill="none"/>

  <!-- flujos animados -->
  <path class="flow" d="M170 210 H225" stroke="#58a6ff"/>
  <path class="flow" d="M355 210 H405" stroke="#F38020"/>
  <path class="flow" d="M525 210 H555" stroke="#a371f7"/>

  <!-- paquete que recorre el camino -->
  <circle r="5" fill="#ffffff">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M25 210 H225 H355 H405 H525 H555 H600"/>
  </circle>

  <text x="450" y="472" class="m" text-anchor="middle">Mi servidor de casa, de punta a punta</text>
</svg>
